<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CV Maker</title>

<style>

body{
font-family:Arial;
background:#f4f4f4;
margin:40px;
}

.container{

max-width:800px;
margin:auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 0 20px rgba(0,0,0,.2);

}

input,textarea{

width:100%;
padding:10px;
margin-top:10px;
margin-bottom:20px;
font-size:16px;

}

textarea{

height:120px;

}

button{

background:#0066ff;
color:white;
padding:15px;
border:none;
width:100%;
font-size:18px;
cursor:pointer;
border-radius:5px;

}

button:hover{

background:#0044cc;

}

h1{

text-align:center;

}

</style>

</head>

<body>

<div class="container">

<h1>Professional CV Generator</h1>

<form action="generate" method="POST">

<input
type="text"
name="name"
placeholder="Full Name"
required>

<input
type="text"
name="title"
placeholder="Professional Title">

<input
type="email"
name="email"
placeholder="Email">

<input
type="text"
name="phone"
placeholder="Phone">

<input
type="text"
name="address"
placeholder="Address">

<textarea
name="summary"
placeholder="Professional Summary"></textarea>

<textarea
name="skills"
placeholder="Skills (one per line)"></textarea>

<h2>Experience</h2>

<div id="experienceContainer">

    <div class="experience">

        <input
            type="text"
            name="job_title[]"
            placeholder="Job Title (e.g. Stock Controller)">

        <input
            type="text"
            name="company[]"
            placeholder="Company Name">

        <input
            type="text"
            name="dates[]"
            placeholder="January 2025 - Present">

        <textarea
            name="responsibilities[]"
            placeholder="One responsibility per line"></textarea>

        <hr>

    </div>

</div>

<button
type="button"
onclick="addExperience()">

+ Add Another Experience

</button>

<script>

function addExperience(){

const container=document.getElementById("experienceContainer");

const div=document.createElement("div");

div.className="experience";

div.innerHTML=`

<input
type="text"
name="job_title[]"
placeholder="Job Title">

<input
type="text"
name="company[]"
placeholder="Company Name">

<input
type="text"
name="dates[]"
placeholder="Employment Dates">

<textarea
name="responsibilities[]"
placeholder="One responsibility per line"></textarea>

<hr>

`;

container.appendChild(div);

}

</script>

<textarea
name="education"
placeholder="Education"></textarea>

<button>

Generate CV DOCX

</button>

</form>

</div>

</body>
</html>
