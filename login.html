<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to your Code Tutorium account to track your learning progress, saved code snippets, and custom programming exercises on our free learning platform.">
  <title>Log In — Code Tutorium</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="index.css">
  
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Canonical URL -->
  <link rel="canonical" href="https://codetutorium.com/login">
</head>
<body class="auth-page-body">

<!-- NAV -->
<nav class="top">
  <a href="/" class="logo">code<span class="cursor"></span>tutorium</a>
  <div class="nav-right">
    <a href="/blog/index" class="nav-cta">blog</a>
  </div>
</nav>

<!-- CONTENT -->
<main class="auth-container">
  <div class="auth-page-card">
    <div class="auth-page-header">
      <span class="auth-icon">🔑</span>
      <h1 class="auth-title">Log In</h1>
      <p class="auth-subtitle">Welcome back to Code Tutorium</p>
    </div>
    
    <form id="login-form">
      <div class="form-group">
        <label for="auth-email">email_address</label>
        <input type="email" id="auth-email" required placeholder="name@example.com" autocomplete="email">
      </div>
      <div class="form-group mt-1">
        <label for="auth-password">password</label>
        <input type="password" id="auth-password" required placeholder="••••••••" minlength="6" autocomplete="current-password">
      </div>
      
      <div id="auth-error-msg" class="auth-message error hidden"></div>
      <div id="auth-success-msg" class="auth-message success hidden"></div>

      <button type="submit" class="enroll-btn mt-2" id="login-submit-btn">
        <span class="btn-text">Continue</span>
        <span class="btn-loader hidden">⌛</span>
      </button>
    </form>
    
    <div class="auth-switch-box">
      <span>Don't have an account?</span>
      <a href="/register">Register</a>
    </div>
  </div>
</main>

<!-- FOOTER -->
<footer class="profile-footer">
  <p>© 2026 Code Tutorium. All rights reserved.</p>
</footer>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-auth.js"></script>

</body>
</html>
