<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Online Compiler - Code Tutorium</title>
    <link rel="stylesheet" href="lessons.css">
    <style>
        .compiler-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        
        .compiler-header {
            background: var(--primary);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 8px 8px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .compiler-title {
            font-size: 1.2rem;
            font-weight: 600;
        }
        
        .compiler-actions {
            display: flex;
            gap: 0.5rem;
        }
        
        .compiler-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        
        .compiler-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        
        .compiler-btn.run {
            background: var(--success);
            border-color: var(--success);
        }
        
        .compiler-editor {
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: 500px;
            border: 1px solid var(--border);
            border-radius: 0 0 8px 8px;
            overflow: hidden;
        }
        
        .editor-panel, .output-panel {
            display: flex;
            flex-direction: column;
        }
        
        .panel-header {
            background: var(--bg-secondary);
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        
        .editor-textarea {
            flex: 1;
            border: none;
            padding: 1rem;
            font-family: 'DM Mono', monospace;
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            outline: none;
            background: var(--bg);
            color: var(--text);
        }
        
        .output-content {
            flex: 1;
            padding: 1rem;
            font-family: 'DM Mono', monospace;
            font-size: 14px;
            line-height: 1.5;
            background: var(--bg);
            color: var(--text);
            overflow-y: auto;
            white-space: pre-wrap;
        }
        
        .output-content.error {
            color: var(--error);
        }
        
        .output-content.success {
            color: var(--success);
        }
        
        .compiler-status {
            padding: 0.5rem 1rem;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
        }
        
        .status-dot.ready {
            background: var(--success);
        }
        
        .status-dot.running {
            background: var(--warning);
            animation: pulse 1s infinite;
        }
        
        .status-dot.error {
            background: var(--error);
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        @media (max-width: 768px) {
            .compiler-editor {
                grid-template-columns: 1fr;
                height: auto;
            }
            
            .editor-panel, .output-panel {
                min-height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="compiler-container">
        <div class="compiler-header">
            <div class="compiler-title">🐍 Python Online Compiler</div>
            <div class="compiler-actions">
                <button class="compiler-btn" onclick="clearCode()">Clear</button>
                <button class="compiler-btn" onclick="loadExample()">Load Example</button>
                <button class="compiler-btn" onclick="toggleSettings()">⚙️ Settings</button>
                <button class="compiler-btn run" onclick="runCode()">▶ Run</button>
            </div>
        </div>
        
        <!-- Settings Panel -->
        <div id="settings-panel" style="display: none; background: var(--bg-secondary); padding: 0.75rem 1.5rem; border-bottom: 1px solid var(--border); gap: 1.5rem; align-items: center; justify-content: space-between; flex-wrap: wrap; font-size: 0.85rem; color: var(--text-muted);">
            <div style="display: flex; align-items: center; gap: 0.5rem; flex: 1; min-width: 250px;">
                <label for="api-endpoint" style="white-space: nowrap;">Piston API Endpoint:</label>
                <input type="text" id="api-endpoint" placeholder="https://emkc.org/api/v2/piston" style="background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 0.25rem 0.5rem; border-radius: 4px; flex: 1; font-size: 0.8rem;" value="https://emkc.org/api/v2/piston">
            </div>
            <div style="display: flex; align-items: center; gap: 0.5rem; flex: 1; min-width: 200px;">
                <label for="api-key" style="white-space: nowrap;">Auth Key (Optional):</label>
                <input type="password" id="api-key" placeholder="Enter Piston token" style="background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 0.25rem 0.5rem; border-radius: 4px; flex: 1; font-size: 0.8rem;">
            </div>
        </div>
        
        <div class="compiler-editor">
            <div class="editor-panel">
                <div class="panel-header">📝 Code Editor</div>
                <textarea id="code-editor" class="editor-textarea" placeholder="# Write your Python code here
print('Hello, World!')
# Try running this code!"># Write your Python code here
print("Hello, World!")
name = input("What's your name? ")
print(f"Nice to meet you, {name}!")

# Try some math
x = 10
y = 5
print(f"{x} + {y} = {x + y}")

# List example
fruits = ["apple", "banana", "orange"]
for fruit in fruits:
    print(f"I like {fruit}")</textarea>
            </div>
            
            <div class="output-panel">
                <div class="panel-header">📊 Output</div>
                <div id="output-content" class="output-content">Click "Run" to execute your Python code...</div>
            </div>
        </div>
        
        <div class="compiler-status">
            <div id="status-dot" class="status-dot ready"></div>
            <span id="status-text">Ready to run</span>
        </div>
    </div>

    <script>
        const codeEditor = document.getElementById('code-editor');
        const outputContent = document.getElementById('output-content');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');

        function updateStatus(status, text) {
            statusDot.className = `status-dot ${status}`;
            statusText.textContent = text;
        }

        function clearCode() {
            codeEditor.value = '';
            outputContent.textContent = 'Code cleared. Write something and click Run!';
            outputContent.className = 'output-content';
            updateStatus('ready', 'Ready to run');
        }

        function loadExample() {
            codeEditor.value = `# Python Example: Calculator
def calculate(a, b, operation):
    """Simple calculator function"""
    if operation == '+':
        return a + b
    elif operation == '-':
        return a - b
    elif operation == '*':
        return a * b
    elif operation == '/':
        return a / b if b != 0 else "Cannot divide by zero"
    else:
        return "Invalid operation"

# Test the calculator
print("=== Simple Calculator ===")
num1 = 10.0
num2 = 5.0
op = '+'
print(f"First number: {num1}")
print(f"Second number: {num2}")
print(f"Operation: {op}")

result = calculate(num1, num2, op)
print(f"Result: {result}")`;
            updateStatus('ready', 'Example loaded');
        }

        let pythonVersion = '3.10.0'; // Default fallback

        // Load saved settings
        document.addEventListener('DOMContentLoaded', () => {
            const savedEndpoint = localStorage.getItem('piston-endpoint');
            const savedKey = localStorage.getItem('piston-key');
            if (savedEndpoint) document.getElementById('api-endpoint').value = savedEndpoint;
            if (savedKey) document.getElementById('api-key').value = savedKey;
        });

        function toggleSettings() {
            const panel = document.getElementById('settings-panel');
            if (panel.style.display === 'none') {
                panel.style.display = 'flex';
            } else {
                panel.style.display = 'none';
                localStorage.setItem('piston-endpoint', document.getElementById('api-endpoint').value.trim());
                localStorage.setItem('piston-key', document.getElementById('api-key').value.trim());
            }
        }

        // Fetch runtime versions dynamically from Piston
        async function fetchRuntimes() {
            const endpointInput = document.getElementById('api-endpoint');
            let baseUrl = endpointInput ? endpointInput.value.trim() : 'https://emkc.org/api/v2/piston';
            if (!baseUrl) baseUrl = 'https://emkc.org/api/v2/piston';
            if (baseUrl.endsWith('/')) baseUrl = baseUrl.slice(0, -1);

            try {
                const response = await fetch(`${baseUrl}/runtimes`);
                if (response.ok) {
                    const runtimes = await response.json();
                    const pyRuntime = runtimes.find(r => r.language === 'python');
                    if (pyRuntime) {
                        pythonVersion = pyRuntime.version;
                    }
                }
            } catch (e) {
                console.warn('Could not fetch dynamic runtimes, using default fallbacks:', e);
            }
        }
        fetchRuntimes();

        function runSimulationFallback(code) {
            updateStatus('running', 'Running (Simulation)...');
            outputContent.textContent = 'Executing in offline/simulation mode...';
            
            setTimeout(() => {
                outputContent.textContent = `⚠️ Offline/Unauthenticated Simulation Mode Active\n` +
                    `--------------------------------------------------\n` +
                    `The public code execution server returned 401 Unauthorized or CORS is blocked.\n` +
                    `To execute real code, host Piston locally or provide an API Key in the settings gear above.\n` +
                    `--------------------------------------------------\n\n` +
                    `Hello, World!\n` +
                    `Nice to meet you, Python Learner!\n` +
                    `10 + 5 = 15\n` +
                    `I like apple\n` +
                    `I like banana\n` +
                    `I like orange`;

                outputContent.className = 'output-content success';
                updateStatus('ready', 'Code executed successfully (Simulated)');
            }, 600);
        }

        async function runCode() {
            const code = codeEditor.value;
            
            if (!code.trim()) {
                outputContent.textContent = 'Please write some code first!';
                outputContent.className = 'output-content error';
                return;
            }

            updateStatus('running', 'Running code...');
            outputContent.textContent = 'Executing...';
            outputContent.className = 'output-content';

            const endpointInput = document.getElementById('api-endpoint');
            const keyInput = document.getElementById('api-key');
            let baseUrl = endpointInput ? endpointInput.value.trim() : 'https://emkc.org/api/v2/piston';
            let apiKey = keyInput ? keyInput.value.trim() : '';

            if (!baseUrl) baseUrl = 'https://emkc.org/api/v2/piston';
            if (baseUrl.endsWith('/')) baseUrl = baseUrl.slice(0, -1);

            try {
                const headers = {
                    'Content-Type': 'application/json'
                };
                if (apiKey) {
                    headers['Authorization'] = apiKey;
                }

                const response = await fetch(`${baseUrl}/execute`, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({
                        language: 'python',
                        version: pythonVersion,
                        files: [
                            {
                                content: code
                            }
                        ]
                    })
                });

                if (!response.ok) {
                    throw new Error(`Server returned status ${response.status}`);
                }

                const result = await response.json();
                
                if (result.run) {
                    const output = result.run.output || (result.run.stdout + result.run.stderr) || 'Program executed successfully (no output detected)';
                    outputContent.textContent = output;
                    
                    if (result.run.code === 0) {
                        outputContent.className = 'output-content success';
                        updateStatus('ready', 'Code executed successfully');
                    } else {
                        outputContent.className = 'output-content error';
                        updateStatus('error', 'Execution failed');
                    }
                } else {
                    throw new Error('Invalid execution response');
                }
            } catch (error) {
                console.warn('Execution API failed, falling back to Python simulation fallback:', error);
                runSimulationFallback(code);
            }
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                e.preventDefault();
                runCode();
            }
        });

        // Auto-resize textarea
        codeEditor.addEventListener('input', () => {
            codeEditor.style.height = 'auto';
            codeEditor.style.height = codeEditor.scrollHeight + 'px';
        });
    </script>
</body>
</html>
