<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Code Tutorium</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="index.css">
  
  <link rel="icon" type="image/png" href="favicon.png">
</head>
<body class="auth-page-body">

<!-- NAV -->
<nav class="top">
  <a href="index.html" class="logo">code<span class="cursor"></span>tutorium</a>
  <div class="nav-right">
    <a href="blog/index.html" class="nav-cta">blog</a>
  </div>
</nav>

<!-- CONTENT -->
<main class="auth-container">
  <div class="auth-page-card">
    <div class="auth-page-header">
      <span class="auth-icon" id="register-emoji">🚀</span>
      <h1 class="auth-title" id="register-title">Register</h1>
      <p class="auth-subtitle" id="register-subtitle">Create a free account to access all courses</p>
    </div>
    
    <form id="register-form">
      <!-- Step 1: Credentials -->
      <div id="auth-step-credentials">
        <div class="form-group">
          <label for="auth-email">email_address</label>
          <input type="email" id="auth-email" placeholder="name@example.com" autocomplete="email">
        </div>
        <div class="form-group mt-1">
          <label for="auth-password">password</label>
          <input type="password" id="auth-password" placeholder="••••••••" minlength="6" autocomplete="new-password">
        </div>
      </div>

      <!-- Step 2: Profile Details -->
      <div id="auth-step-profile" class="hidden">
        <div class="form-group">
          <label for="auth-name">full_name</label>
          <input type="text" id="auth-name" placeholder="John Doe">
        </div>
        <div class="form-group mt-1">
          <label for="auth-age">age</label>
          <input type="number" id="auth-age" min="1" max="120" placeholder="21">
        </div>
        <div class="form-group mt-1">
          <label for="auth-profession">profession</label>
          <select id="auth-profession">
            <option value="" disabled selected>Select profession...</option>
            <option value="high_school">High School Student</option>
            <option value="undergraduate">Undergraduate Student</option>
            <option value="graduate">Graduate Student</option>
            <option value="working_professional">Working Professional</option>
            <option value="self_employed">Self-Employed</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="form-group mt-1">
          <label for="auth-experience">programming_experience</label>
          <select id="auth-experience">
            <option value="" disabled selected>Select experience...</option>
            <option value="beginner">Beginner</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>
          </select>
        </div>
        <div class="form-group mt-1">
          <label for="auth-github">github_username</label>
          <input type="text" id="auth-github" placeholder="username">
        </div>
      </div>
      
      <div id="auth-error-msg" class="auth-message error hidden"></div>
      <div id="auth-success-msg" class="auth-message success hidden"></div>

      <button type="submit" class="enroll-btn mt-2" id="register-submit-btn">
        <span class="btn-text">Next →</span>
        <span class="btn-loader hidden">⌛</span>
      </button>
    </form>
    
    <div class="auth-switch-box">
      <span id="register-switch-text">Already have an account?</span>
      <a href="login.html" id="register-switch-link">Log In</a>
    </div>
  </div>
</main>

<!-- FOOTER -->
<footer class="profile-footer">
  <p>© 2026 Code Tutorium. All rights reserved.</p>
</footer>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-auth.js"></script>

</body>
</html>
